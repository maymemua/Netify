# Neo4j chạy local, thay cho Aura khi thử nghiệm.
# Mở trình duyệt: http://localhost:7474  (user neo4j / mật khẩu bên dưới)
services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme123}
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
